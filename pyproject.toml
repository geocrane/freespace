[project]
name = "freespace"
version = "0.2.0"
description = "Анализатор дискового пространства для Windows, macOS и Linux (аналог DaisyDisk)"
requires-python = ">=3.10"
# Базовая установка не тянет ни Qt, ни веб — фронтенд выбирается через extras.
dependencies = []

[project.optional-dependencies]
web = [
    "fastapi>=0.110",
    "uvicorn>=0.27",
]
qt = [
    "PySide6>=6.6",
]
dev = [
    "pytest>=7.0",
    # Нужен fastapi.testclient — без него тесты HTTP-слоя не поднимутся.
    "httpx>=0.27",
]

[project.scripts]
freespace-web = "freespace.web.__main__:main"
freespace = "freespace.ui.app:main"
freespace-spike = "freespace.web.spike:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["freespace*"]

[tool.setuptools.package-data]
"freespace.web" = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
